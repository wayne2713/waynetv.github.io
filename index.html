<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayneTV - Ultimate UCL Multiview</title>
    <style>
        :root {
            --bg-deep: #0b0e14;
            --bg-card: #131822;
            --bg-header: #19202e;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 12px 35px -10px rgba(0, 0, 0, 0.6);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(34, 197, 94, 0.04) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.03) 0%, transparent 45%);
            background-attachment: fixed;
        }

        h1 {
            color: var(--text-main);
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* Responsive Grid for All UCL Streams */
        .multiview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .stream-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s ease;
        }

        .stream-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
        }

        .card-header {
            padding: 12px 16px;
            background: var(--bg-header);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .card-header h3 {
            margin: 0;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .badge-live-now {
            background: rgba(34, 197, 94, 0.12);
            color: var(--accent-green);
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .badge-live-now::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .source-bar {
            background: rgba(11, 14, 20, 0.6);
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .source-select {
            background: var(--bg-deep);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none; 
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px;
        }

        .source-select:hover, .source-select:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.2);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>WayneTV - Ultimate UCL Multiview</h1>

    <div class="multiview-grid">
        <!-- Liverpool vs Atletico Madrid -->
        <div class="stream-card">
            <div class="card-header">
                <h3>Liverpool vs Atletico Madrid</h3>
                <span class="badge-live-now">LIVE</span>
            </div>
            <div class="source-bar">
                <select class="source-select" onchange="changeStream(this, 'liv-atm-stream')">
                    <option value="https://epiembeds.online/embed/beinsports3-sa">Arabic</option>
                    <option value="https://epiembeds.online/embed/tntsports1-uk">TNT Sports 1</option>
                    <option value="https://streamxhd.com/live2.php?stream=espn">Spanish</option>
                </select>
            </div>
            <div class="video-container">
                <iframe id="liv-atm-stream" src="https://epiembeds.online/embed/beinsports3-sa" width="100%" height="100%" frameborder="0" scrolling="no" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
            </div>
        </div>

        <!-- PSG vs Slovan Bratislava -->
        <div class="stream-card">
            <div class="card-header">

                    <option value="https://epiembeds.online/embed/beinsports1-sa">Arabic</option>

            </div>
            <div class="video-container">
                <iframe id="psg-slo-stream" src="https://streamxhd.com/live2.php?stream=espn3" width="100%" height="100%" frameborder="0" scrolling="no" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Napoli vs Arsenal -->
        <div class="stream-card">
            <div class="card-header">
                <h3>Napoli vs Arsenal</h3>
                <span class="badge-live-now">LIVE</span>
            </div>
            <div class="source-bar">
                <select class="source-select" onchange="changeStream(this, 'nap-ars-stream')">
                    <option value="https://epiembeds.online/embed/beinsports2-sa">Arabic</option>

            </div>
            <div class="video-container">
                <iframe id="nap-ars-stream" src="https://epiembeds.online/embed/beinsports2-sa" width="100%" height="100%" frameborder="0" scrolling="no" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Manchester City vs Porto -->
        <div class="stream-card">
            <div class="card-header">
                <h3>Man City vs Porto</h3>
                <span class="badge-live-now">LIVE</span>
            </div>
            <div class="source-bar">
                <select class="source-select" onchange="changeStream(this, 'mci-por-stream')">
                    <option value="https://streamxhd.click/channel/?id=espn5">ESPN</option>
                    <option value="https://epiembeds.online/embed/tntsports2-uk">TNT 2</option>
                    <option value="https://dlive.sx/cast/stream-105.php">Paramount+</option>
                </select>
            </div>
            <div class="video-container">
                <iframe id="mci-por-stream" src="https://streamxhd.click/channel/?id=espn5" width="100%" height="100%" style="border:0;" scrolling="no" frameborder="no" allow="fullscreen" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Real Madrid vs Inter Milan -->
        <div class="stream-card">
            <div class="card-header">
                <h3>Real Madrid vs Inter Milan</h3>
                <span class="badge-live-now">LIVE</span>
            </div>
            <div class="source-bar">
                <select class="source-select" onchange="changeStream(this, 'rma-int-stream')">
                    <option value="https://dlive.sx/cast/stream-77.php">Paramount+</option>
                    <option value="https://streamxhd.click/channel/?id=espn">ESPN</option>
                    <option value="https://streamxhd.click/channel/?id=tnt1uk">TNT Sports</option>
                </select>
            </div>
            <div class="video-container">
                <iframe id="rma-int-stream" src="https://dlive.sx/cast/stream-77.php" width="100%" height="100%" style="border:0;" scrolling="no" frameborder="no" allow="fullscreen" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        function changeStream(selectElement, iframeId) {
            const selectedUrl = selectElement.value;
            const iframe = document.getElementById(iframeId);
            iframe.src = selectedUrl;
        }
    </script>

</body>
</html>
