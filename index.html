
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayneTV - Live Matches</title>
    <style>
        :root {
            --bg-deep: #0b0e14;
            --bg-card: #131822;
            --bg-header: #19202e;
            --accent-green: #22c55e;
            --accent-green-glow: rgba(34, 197, 94, 0.25);
            --accent-red: #ef4444;
            --accent-red-glow: rgba(239, 68, 68, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 12px 35px -10px rgba(0, 0, 0, 0.6);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 25px 15px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(34, 197, 94, 0.04) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(239, 68, 68, 0.03) 0%, transparent 45%);
            background-attachment: fixed;
        }

        h1 {
            color: var(--text-main);
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .stream-card {
            margin-bottom: 35px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: var(--card-shadow);
            position: relative;
            background-image: linear-gradient(145deg, rgba(255, 255, 255, 0.02) 0%, transparent 100%);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .stream-card:hover {
            border-color: rgba(34, 197, 94, 0.3);
        }

        .card-header {
            padding: 16px 20px;
            background: var(--bg-header);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .card-header h3 {
            margin: 0;
            color: var(--text-main);
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .badge-live-now {
            background: rgba(34, 197, 94, 0.12);
            color: var(--accent-green);
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .badge-live-now::before {
            content: '';
            width: 7px;
            height: 7px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>WayneTV</h1>

    <div class="stream-card">
        <div class="card-header">
            <h3>Barcelona vs Valencia</h3>
            <span class="badge-live-now">LIVE NOW</span>
        </div>
        <div class="video-container">
            <iframe src="https://streamxhd.st/live2.php?stream=mlaliga" width="100%" height="100%" style="border:0;" scrolling="no" frameborder="no" allow="fullscreen" allowfullscreen></iframe>
        </div>
    </div>

    <div class="stream-card">
        <div class="card-header">
            <h3>Caze TV</h3>
            <span class="badge-live-now">LIVE NOW</span>
        </div>
        <div class="video-container">
            <iframe src="//cdn.stmify.com/embed-free/v1/cazetv-br-jw" width="100%" height="100%" style="border:0;" marginheight="0" marginwidth="0" scrolling="no" frameborder="0" allowfullscreen allow="encrypted-media"></iframe>
        </div>
    </div>

    <div class="stream-card">
        <div class="card-header">
            <h3>ESPN</h3>
            <span class="badge-live-now">LIVE NOW</span>
        </div>
        <div class="video-container">
            <iframe src="https://streamxhd.com/live2.php?stream=espndeportes" width="100%" height="100%" style="border:0;" scrolling="no" frameborder="no" allow="fullscreen" allowfullscreen></iframe>
        </div>
    </div>

    <div class="stream-card">
        <div class="card-header">
            <h3>Sky Main Event</h3>
            <span class="badge-live-now">LIVE NOW</span>
        </div>
        <div class="video-container">
            <iframe src="https://dlive.sx/cast/stream-38.php" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
